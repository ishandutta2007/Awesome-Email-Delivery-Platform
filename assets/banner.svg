<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#text-grad);
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Subtle background animations */
    @keyframes float-slow {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float-reverse {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-4deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }

    .animated-orb-1 {
      animation: float-slow 8s ease-in-out infinite, pulse-glow 6s ease-in-out infinite;
    }
    .animated-orb-2 {
      animation: float-reverse 10s ease-in-out infinite, pulse-glow 7s ease-in-out infinite;
    }
    .connecting-line {
      stroke-dasharray: 8, 8;
      animation: dash-flow 3s linear infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2" />

  <!-- Background Animated Decorative Orbs (Positioned safely in background) -->
  <g opacity="0.6">
    <circle class="animated-orb-1" cx="150" cy="100" r="180" fill="url(#cyan-glow)" filter="url(#glow-filter)" />
    <circle class="animated-orb-2" cx="1050" cy="300" r="220" fill="url(#purple-glow)" filter="url(#glow-filter)" />
  </g>

  <!-- Network Infrastructure Grid Graphics (Right/Background decorative element) -->
  <g opacity="0.25">
    <line x1="800" y1="100" x2="950" y2="180" stroke="#38bdf8" stroke-width="2" class="connecting-line" />
    <line x1="950" y1="180" x2="1100" y2="120" stroke="#818cf8" stroke-width="2" class="connecting-line" />
    <line x1="950" y1="180" x2="1000" y2="300" stroke="#c084fc" stroke-width="2" class="connecting-line" />
    
    <circle cx="800" cy="100" r="6" fill="#38bdf8" />
    <circle cx="950" cy="180" r="9" fill="#818cf8" />
    <circle cx="1100" cy="120" r="7" fill="#c084fc" />
    <circle cx="1000" cy="300" r="8" fill="#f472b6" />
  </g>

  <!-- Email / Envelope Node Graphic Icon (Left Side Foreground Element) -->
  <g transform="translate(80, 130)" filter="url(#soft-shadow)">
    <!-- Shield / Mail Backdrop Card -->
    <rect x="0" y="0" width="110" height="110" rx="22" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="5" y="5" width="100" height="100" rx="18" fill="url(#text-grad)" opacity="0.15" />
    
    <!-- Envelope Icon -->
    <path d="M25 35 L85 35 C90 35 93 38 93 43 L93 75 C93 80 90 83 85 83 L25 83 C20 83 17 80 17 75 L17 43 C17 38 20 35 25 35 Z" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M19 37 L55 62 C57 63 58 63 60 62 L96 37" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="85" cy="35" r="5" fill="#4ade80" />
  </g>

  <!-- Main Foreground Content Container (Guaranteed Foreground Visibility) -->
  <g transform="translate(220, 135)" filter="url(#soft-shadow)">
    <!-- Main Title -->
    <text x="0" y="42" class="title-text">Awesome Email Delivery Platform</text>
    
    <!-- Subtitle -->
    <text x="0" y="80" class="subtitle-text">Curated SaaS APIs, Open-Source MTAs, DMARC Enforcement &amp; Deliverability Tools</text>
    
    <!-- Feature Pill Badges -->
    <g transform="translate(0, 110)">
      <!-- Pill 1: Transactional APIs -->
      <g transform="translate(0, 0)">
        <rect width="165" height="32" rx="16" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
        <text x="16" y="20" class="badge-text" fill="#38bdf8">⚡ Transactional APIs</text>
      </g>
      
      <!-- Pill 2: DMARC & Auth -->
      <g transform="translate(177, 0)">
        <rect width="180" height="32" rx="16" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" />
        <text x="16" y="20" class="badge-text" fill="#a78bfa">🔒 DMARC &amp; Auth</text>
      </g>
      
      <!-- Pill 3: Open Source MTAs -->
      <g transform="translate(369, 0)">
        <rect width="175" height="32" rx="16" fill="#1e293b" stroke="#059669" stroke-width="1.5" />
        <text x="16" y="20" class="badge-text" fill="#34d399">🛠️ Open-Source MTAs</text>
      </g>
      
      <!-- Pill 4: Warmup & Inbox -->
      <g transform="translate(556, 0)">
        <rect width="165" height="32" rx="16" fill="#1e293b" stroke="#db2777" stroke-width="1.5" />
        <text x="16" y="20" class="badge-text" fill="#f472b6">🔥 Email Warmup</text>
      </g>
    </g>
  </g>
</svg>
